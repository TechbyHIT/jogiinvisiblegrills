# /etc/nginx/sites-available/jogiinvisiblegrills.in
# sudo ln -s .../jogiinvisiblegrills.in /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# Certificate must include BOTH names (fixes NET::ERR_CERT_COMMON_NAME_INVALID on apex):
#   sudo certbot certonly --nginx -d jogiinvisiblegrills.in -d www.jogiinvisiblegrills.in
# Or: sudo certbot --nginx -d jogiinvisiblegrills.in -d www.jogiinvisiblegrills.in

server {
    listen 80;
    listen [::]:80;
    server_name jogiinvisiblegrills.in www.jogiinvisiblegrills.in;
    return 301 https://www.jogiinvisiblegrills.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jogiinvisiblegrills.in;

    ssl_certificate /etc/letsencrypt/live/jogiinvisiblegrills.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jogiinvisiblegrills.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.jogiinvisiblegrills.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jogiinvisiblegrills.in;

    ssl_certificate /etc/letsencrypt/live/jogiinvisiblegrills.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jogiinvisiblegrills.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
