# Shared nginx performance snippet — include inside each site's server { } block
# include /etc/nginx/snippets/nextjs-proxy.conf;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
  text/plain text/css text/xml application/xml application/json
  application/javascript application/x-javascript text/javascript
  image/svg+xml;

# Brotli (if nginx-module-brotli installed via install-server-optimizations.sh)
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css application/json application/javascript text/xml application/xml;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
proxy_read_timeout 120s;
proxy_connect_timeout 15s;
proxy_send_timeout 120s;

# Static sitemaps: set per-site alias in vhost, e.g.:
